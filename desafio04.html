<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - TechFix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">DS • Bootstrap 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPortifolio" aria-controls="menuPortifolio" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPortifolio">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio01.html">Desafio 01</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio02.html">Desafio 02</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio03.html">Desafio 03</a></li>
                    <li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 04</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio05.html">Desafio 05</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- FORMULÁRIO -->
    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h2 class="fw-bold mb-2">TechFix Assistência Técnica</h2>
                        <p class="text-muted mb-4">Preencha os dados para solicitar um atendimento.</p>

                        <!-- Mensagem de confirmação -->
                        <div id="mensagemSucesso" class="alert alert-success d-none" role="alert">
                            Solicitação preenchida com sucesso! Este formulário é uma demonstração.
                        </div>

                        <form id="formAtendimento">

                            <div class="row g-3">

                                <!-- Nome -->
                                <div class="col-sm-6">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" placeholder="Seu nome" required>
                                </div>

                                <!-- Sobrenome -->
                                <div class="col-sm-6">
                                    <label for="sobrenome" class="form-label">Sobrenome</label>
                                    <input type="text" class="form-control" id="sobrenome" placeholder="Seu sobrenome" required>
                                </div>

                                <!-- Telefone -->
                                <div class="col-md-6">
                                    <label for="telefone" class="form-label">Telefone / WhatsApp</label>
                                    <div class="input-group">
                                        <span class="input-group-text">+55</span>
                                        <input type="tel" class="form-control" id="telefone" placeholder="(41) 99999-9999" required>
                                    </div>
                                </div>

                                <!-- E-mail -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control" id="email" placeholder="seuemail@email.com" required>
                                </div>

                                <!-- Equipamento -->
                                <div class="col-12">
                                    <label for="equipamento" class="form-label">Equipamento</label>
                                    <input type="text" class="form-control" id="equipamento" placeholder="Ex.: Notebook Dell, computador..." required>
                                </div>

                                <!-- Tipo de serviço -->
                                <div class="col-md-6">
                                    <label for="servico" class="form-label">Tipo de Serviço</label>
                                    <select class="form-select" id="servico" required>
                                        <option value="" selected disabled>Selecione uma opção</option>
                                        <option value="Manutenção">Manutenção</option>
                                        <option value="Formatação">Formatação</option>
                                        <option value="Troca de peças">Troca de peças</option>
                                        <option value="Limpeza">Limpeza</option>
                                        <option value="Diagnóstico">Diagnóstico</option>
                                    </select>
                                </div>

                                <!-- Valor -->
                                <div class="col-md-6">
                                    <label for="valor" class="form-label">Valor estimado</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" class="form-control" id="valor" placeholder="0,00" min="0" step="0.01">
                                    </div>
                                </div>

                                <!-- Observações -->
                                <div class="col-12">
                                    <label for="observacoes" class="form-label">Observações</label>
                                    <textarea class="form-control" id="observacoes" rows="4" placeholder="Descreva o problema apresentado pelo equipamento..."></textarea>
                                </div>

                                <!-- Checkbox -->
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="confirmacao" required>
                                        <label class="form-check-label" for="confirmacao">
                                            Estou ciente de que os dados serão utilizados para o atendimento.
                                        </label>
                                    </div>
                                </div>

                                <!-- Botão -->
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-success w-100">
                                        Enviar Solicitação
                                    </button>
                                </div>

                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        const formulario = document.getElementById("formAtendimento");
        const mensagem = document.getElementById("mensagemSucesso");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            if (formulario.checkValidity()) {
                mensagem.classList.remove("d-none");
                formulario.reset();
            } else {
                formulario.reportValidity();
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
